name: Render smoke test

on:
  push:
    branches: [main]

jobs:
  test-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Two-player draft and game-state smoke test
        shell: bash
        run: |
          cat > /tmp/test-render.mjs <<'EOF'
          const HTTP='https://dota-3v3-lobby.onrender.com';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          async function retry(fn, tries=12, wait=5000){
            let last;
            for(let i=0;i<tries;i++){
              try{return await fn()}catch(e){last=e; console.log('retry',i+1,e.message); await sleep(wait)}
            }
            throw last;
          }

          function openWS(url,name){
            return new Promise((resolve,reject)=>{
              const ws=new WebSocket(url);
              const timer=setTimeout(()=>reject(new Error(name+' open timeout')),20000);
              ws.addEventListener('open',()=>{clearTimeout(timer);resolve(ws)},{once:true});
              ws.addEventListener('error',()=>{clearTimeout(timer);reject(new Error(name+' websocket error'))},{once:true});
            });
          }

          function listen(ws,name){
            const messages=[];
            ws.addEventListener('message',ev=>{
              let m; try{m=JSON.parse(ev.data)}catch{m=ev.data}
              messages.push(m);
              console.log(name,'<=',JSON.stringify(m));
            });
            ws.addEventListener('close',ev=>console.log(name,'CLOSE',ev.code,ev.reason));
            return messages;
          }

          const health=await retry(async()=>{
            const r=await fetch(HTTP+'/health');
            if(!r.ok) throw new Error('health '+r.status);
            return r.json();
          });
          console.log('health',health);

          const room=await retry(async()=>{
            const r=await fetch(HTTP+'/api/lobbies',{
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify({name:'CI smoke '+Date.now(),hostProfile:{nick:'CI',rating:1000}})
            });
            if(!r.ok) throw new Error('create '+r.status+' '+await r.text());
            return r.json();
          });
          console.log('room',room.id);

          const wsurl=HTTP.replace('https://','wss://')+'/ws?room='+encodeURIComponent(room.id);
          const p1=await openWS(wsurl,'P1');
          const p1m=listen(p1,'P1');
          await sleep(400);
          const p2=await openWS(wsurl,'P2');
          const p2m=listen(p2,'P2');
          await sleep(800);

          const chosen=['mars','enigma','broodmother','arcwarden','axe','pudge'];
          for(let i=0;i<chosen.length;i++){
            const sender=i%2===0?p1:p2;
            sender.send(JSON.stringify({type:'state',G:null,chosen:chosen.slice(0,i+1),phase:'draft'}));
            await sleep(600);
            if(p1.readyState!==WebSocket.OPEN||p2.readyState!==WebSocket.OPEN)
              throw new Error('socket dropped after pick '+(i+1));
          }

          const G={
            matchId:'ci-'+Date.now(),
            teams:[
              [{id:'mars',hp:9,maxHp:9,damage:2},{id:'broodmother',hp:8,maxHp:8,damage:1},{id:'axe',hp:8,maxHp:8,damage:1}],
              [{id:'enigma',hp:7,maxHp:7,damage:1},{id:'arcwarden',hp:7,maxHp:7,damage:1},{id:'pudge',hp:10,maxHp:10,damage:2}]
            ],
            front:[0,0],team:0,actions:2,attackUsed:false,round:0,winner:null,log:[],turnSerial:0
          };
          p1.send(JSON.stringify({type:'state',G,chosen,phase:'game'}));
          await sleep(1000);

          if(p1.readyState!==WebSocket.OPEN||p2.readyState!==WebSocket.OPEN)
            throw new Error('socket dropped on game transition');

          const p1Draft=p1m.filter(m=>m?.type==='state'&&m?.phase==='draft').length;
          const p2Draft=p2m.filter(m=>m?.type==='state'&&m?.phase==='draft').length;
          const p2Game=p2m.some(m=>m?.type==='state'&&m?.phase==='game');
          console.log({p1Draft,p2Draft,p2Game,p1State:p1.readyState,p2State:p2.readyState});

          if(p1Draft<3) throw new Error('P1 did not receive enough draft relays');
          if(p2Draft<3) throw new Error('P2 did not receive enough draft relays');
          if(!p2Game) throw new Error('P2 did not receive game state');

          p1.close(1000,'CI done');
          p2.close(1000,'CI done');
          await sleep(300);
          console.log('RENDER_SMOKE_TEST_PASS');
          EOF
          node /tmp/test-render.mjs
