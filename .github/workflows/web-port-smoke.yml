name: Web port smoke test

on:
  push:
    branches: [web-prototype]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in *.js; do
            node --check "$f"
          done
      - name: Check 1.86.94 web files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = [
            'index.html','style.css','game.js','network.js','profile.js',
            'assets/portraits/enigma.webm','assets/portraits/arcwarden_clone.webm',
            'assets/audio/background_music.mp3','assets/mars_arena_overlay.png'
          ]
          missing=[p for p in required if not Path(p).is_file()]
          assert not missing, f"Missing required files: {missing}"
          html=Path('index.html').read_text(encoding='utf-8')
          assert 'v1.86.94' in html
          assert 'ОФЛАЙН ИГРА' in html
          assert 'СОЗДАТЬ ЛОББИ' in html
          assert len(list(Path('assets').rglob('*'))) > 400
          print('Static package OK')
          PY
      - name: Serve static build
        run: |
          python3 -m http.server 8765 >/tmp/dota-web.log 2>&1 &
          echo $! >/tmp/dota-web.pid
          sleep 2
          curl -fsS http://127.0.0.1:8765/ >/dev/null
          curl -fsS http://127.0.0.1:8765/assets/portraits/enigma.webm >/dev/null
          curl -fsS http://127.0.0.1:8765/assets/audio/background_music.mp3 >/dev/null
      - name: Check Render backend
        run: |
          curl --retry 6 --retry-delay 5 --max-time 20 -fsS https://dota-3v3-lobby.onrender.com/health | grep -q '"ok":true'
